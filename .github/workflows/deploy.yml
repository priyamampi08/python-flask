name: Flask CI/CD

on:
  push:
    branches:
      - test

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Get the latest code from GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Build Docker image and push it to Docker Hub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: priyamampi08/flask-app:latest

      # 4. Login to AWS using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      # 5. Deploy Docker container to EC2 using SSM
      - name: Deploy to EC2 using SSM
        run: |
          echo "Deploying to EC2: ${{ vars.EC2_INSTANCE_ID }}"

          aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Flask application" \
            --parameters 'commands=[
              "docker pull priyamampi08/flask-app:latest",
              "docker stop flask-app || true",
              "docker rm flask-app || true",
              "docker run -d --restart unless-stopped --name flask-app -p 5000:5000 priyamampi08/flask-app:latest"
            ]'